<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        header {
            background-color: #2a7da0;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-weight: bold;

        }

        nav {
            background-color: #5fa3bf;
            color: #fff;
            text-align: center;
            padding: 5px;
            font-weight: bold;
            
        }

        nav ul{
            list-style-type: none;
            display: flex;
            justify-content: center;
           
        }

        nav ul li a{
            color: rgba(0,12,32);
            text-decoration: none;
            padding: 5px;
            display: block;
        }

        nav ul li a:hover{
            background-color: #2a7da0;
        }

        .submenu{
            display: none;
            position: absolute;
            padding: 0;
            background-color: #5fa3bf;
        }

        .dropdown:hover .submenu{
            display: block;
        }

        
        main {
            display: flex;
            gap: 15px;
            padding: 10px;
            border: 2px dashed #333;

        }

        section {
            flex: 3;
            background-color: #d6f0ea;
            padding: 10px;
        }

        section h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        article {
            border: 2px solid #2dd4d4;
            background-color: #fff;
            padding: 10px;
            border-radius: 14px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #2a7dad;
        }

        article h3 {
            margin-bottom: 10px;
            font-size: 12px;
            color: black;
        }

        aside {
            flex: 1;
            background-color: #fbe2ec;
            padding: 15px;
        }

        aside h3 {
            margin-bottom: 10px;
            font-size: 12px;
            text-align: center;
        }

        footer {
            background: #1c2541;
            color: #fff;
            text-align: center;
            padding: 10px;

        }
    </style>

</head>

<body>

    </header>
    <nav>
        <ul>

                    <li><a href="#">Standard</a></li>

                </ul>
            </li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Bookings</a></li>
            <li><a href="#">Contact us</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <h2>Section</h2>
            <article>

                </p>
            </article>
        </section>
        <section>

                </p>

        </section>
        <aside>
            <h3>Aside</h3>
            <p>Related links / ads</p>
        </aside>
    </main>
    <footer>
        <p>&copy;Right reserved for us</p>

</body>

</html>
