<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Form</title>
    <style>
        body{
            font-family: arial;
            background-color: #f2f2f2;
        }
        form{
            width: 180px;
            margin: auto;
            background-color: white;
            padding: 5px;
        }

        input, select, textarea{
            width: 95%;
            margin: 5px 0;
            padding: 2px;
        }

        button{
            margin-top: 4px;
            padding: 2px;
            width: 95%;
        }
    </style>
</head>
<body>
    <form action="#" method="post" id="customer_form">
        <label for="fname">Fullname:</label>
        <input type="text" id="fname" name="fname"  placeholder="Enter your name..."><br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email..."> <br> <br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter your password..."><br><br>
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" placeholder="Enter your age..."><br><br>
        <label for="checkbox">Select your courses:</label>
        <input type="checkbox" name="chbx" id="chbx"> Java
        <input type="checkbox" name="chbx" id="chbx" checked> HTML
        <input type="checkbox" name="chbx" id="chbx"> CSS<br><br>
        <label for="radio">Select your gender:</label>
        <input type="radio" name="radio" id="radio">Male
        <input type="radio" name="radio" id="radio">Female<br><br>
        <label for="select">Select Your Home Country:</label>
        <select name="country" id="country">
            <option value="" >--Choose--</option>
            <option value="rw">Rwanda</option>
            <option value="gb">Gabon</option>
            <option value="sd">Sudan</option>
        </select><br><br>
        <label for="txtarea">Send your comment:</label><br><br>
        <textarea name="txtarea" id="txtarea" cols="35" rows="4" placeholder="Write your feedack..."></textarea><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
