<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
    <style>
        header{
            background: #52b2f7;
            color:aliceblue;
            text-align:center;
             padding:10px;
             font-weight: bold;

        }
        nav{
            background: #26f985;
            color:black ;
           text-align: center;
            padding:15px;
            font-weight:bold ;
        }
        main{
            display:flex;
            gap:15px;
            padding:15px;
            border: 2px dashed #333;
        }
        section{
            flex:3;
            background: #dacece;
            padding:5px;
        }
        section h3{
            text-align: center;
            margin-bottom:5px;
            font-size:14px;
        }
        article{
            border:1px solid #52b2f7;
            background:#faf9f9;
            padding: 5px;
            border-radius: 8px;
        }
        article h3{
            margin-bottom: 10px;
            font-size: 12px;
            color: #aa1212;
        }
        aside{
            flex:2;
            background: #90f5ee;
            padding:5px;
        }
        aside h4{
            margin-bottom: 10px;
            font-size: 12px;
            text-align: center;
            color: #aa1212;
        }
        footer{
            background: #efa7a7;
            color:#faf9f9;
            text-align: center;
            padding:20px;
            font-weight: bold;
        }
        nav ul{
            list-style-type: none;
            display: flex;
        }
        nav ul li a{
            color:rgb(4,22,39);
            text-decoration: none;
            padding:5px 5px;
            display: block;
        }
        nav ul li a:hover{
            background:#90f5ee;
        }
        .submenu{
            display:none;
            position:absolute;
        }
        .dropdown:hover .submenu{
            display: block;
        }
    </style>
</head>
